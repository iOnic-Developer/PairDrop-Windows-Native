name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PairDropNative.csproj

      - name: Build
        run: dotnet build PairDropNative.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish PairDropNative.csproj --configuration Release --runtime win-x64 --self-contained false --output publish

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PairDropNative-win-x64
          path: |
            publish/PairDropNative.exe
            publish/PairDropNative.pdb
